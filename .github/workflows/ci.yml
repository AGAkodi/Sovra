name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract (unit tests + wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/throttle-vault
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/throttle-vault
      - name: Unit tests
        run: cargo test
      - name: Release wasm build
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Wasm size
        run: ls -l target/wasm32-unknown-unknown/release/throttle_vault.wasm
      # Deployable build via cargo-near (the build path recommended by near-sdk).
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: cargo near build
        run: cargo near build non-reproducible-wasm --no-abi
      - name: Upload deployable wasm
        uses: actions/upload-artifact@v4
        with:
          name: throttle_vault-wasm
          path: contracts/throttle-vault/target/near/throttle_vault.wasm
          if-no-files-found: error

  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
