  <script>
    (function () {
      function split(el) {
        const accent = el.dataset.accent;
        const words = el.textContent.trim().split(/\s+/);

      }
      const tl = gsap.timeline({ paused: true });
      // The key's bow (carried from the last scene) grows, then gives way to the mark.
      tl.fromTo('#rv-ring', { scale: 0.6, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.65, ease: 'power2.inOut' }, 0);
      // The new Sovra mark draws itself along its ribbon, then the fold shades in.
      tl.fromTo('#rv-mark-s-s', { attr: { 'stroke-dashoffset': 1 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.7, ease: 'power2.inOut' }, 0.3);
      tl.fromTo('#rv-mark-s-fold', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.9);
      tl.fromTo('#rv-word', { opacity: 0, clipPath: 'inset(0 100% 0 0)' }, { opacity: 1, clipPath: 'inset(0 0% 0 0)', duration: 0.6, ease: 'power3.out' }, 0.6);
      tl.fromTo(split(document.querySelector('#rv-built')), { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.067 }, 0.9);
