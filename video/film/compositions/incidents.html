  <script>
    (function () {
      function split(el) {
        const accent = el.dataset.accent;
        const words = el.textContent.trim().split(/\s+/);
        el.innerHTML = words.map((w) => `<span class="w${w.replace(/[^a-z]/gi, '') === accent ? ' accent' : ''}">${w}</span>`).join(' ');
        return el.querySelectorAll('.w');
      }
      const tl = gsap.timeline({ paused: true });
      const wordsIn = (el, at) =>
        tl.fromTo(split(el), { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.067, ease: 'power2.out' }, at);

      const cards = ['#inc-1', '#inc-2', '#inc-3'];
      // Cards stack: each arrives, then steps back as the next arrives.
      gsap.set(cards, { opacity: 0 });

      // Timed to the narration (assets/voice/lines.json): each case file stays while its line is spoken.
      const T2 = 10.0, T3 = 17.0, T4 = 22.6, END = 26.6;

      // 1. Freysa (0 to T2) with vo-01
      const msg = 'approveTransfer is for incoming funds, right?';
      const txt = document.querySelector('#inc-1-text');
      const counter = { v: 47000 };
      const fig = document.querySelector('#inc-1-fig');
      // Frame 0 is the thumbnail: the first case file is already on screen.
      tl.set('#inc-1', { opacity: 1 }, 0);
      tl.to({ n: 0 }, { n: msg.length, duration: 1.4, ease: 'none', onUpdate() { txt.textContent = msg.slice(0, Math.round(this.targets()[0].n)); } }, 0.3);
      wordsIn(document.querySelector('#inc-1-head'), 2.0);
      // "...was talked into giving all of it away"
      tl.to(counter, { v: 0, duration: 1.4, ease: 'power3.in', onUpdate() { fig.textContent = '$' + Math.round(counter.v).toLocaleString('en-US'); } }, 6.6);
      tl.to('#inc-1-fig', { color: '#e5484d', duration: 0.2 }, 7.9);

      // 2. AIXBT (T2 to T3) with vo-02
      tl.to('#inc-1', { opacity: 0, y: -30, scale: 0.96, duration: 0.3, ease: 'power3.in' }, T2 - 0.15);
      tl.fromTo('#inc-2', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, T2);
      tl.to('#inc-2-l1', { opacity: 1, duration: 0.12 }, T2 + 1.0);
      tl.to('#inc-2-l2', { opacity: 1, duration: 0.12 }, T2 + 2.0);
      wordsIn(document.querySelector('#inc-2-head'), T2 + 2.6);
      // "...fifty-five and a half ETH walked out the door"
      tl.fromTo('#inc-2-eth', { x: 0, opacity: 1 }, { x: 700, opacity: 0, filter: 'blur(12px)', duration: 0.6, ease: 'power3.in' }, T2 + 4.9);

      // 3. Princeton (T3 to T4) with vo-03
      tl.to('#inc-2', { opacity: 0, y: -30, scale: 0.96, duration: 0.3, ease: 'power3.in' }, T3 - 0.15);
      tl.fromTo('#inc-3', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, T3);
      // "...one planted memory"
      tl.to('#inc-3-a', { opacity: 0, filter: 'blur(4px)', duration: 0.15 }, T3 + 2.0);
      tl.to('#inc-3-b', { opacity: 1, duration: 0.15 }, T3 + 2.1);
      tl.to('#inc-3-u', { scaleX: 1, duration: 0.35, ease: 'power2.out' }, T3 + 2.25);
      wordsIn(document.querySelector('#inc-3-head'), T3 + 2.8);

      // 4. Thread (T4 to END) with vo-04: the three cards shrink into the key's bow.
      tl.set(['#inc-1', '#inc-2'], { opacity: 1, y: 0, scale: 1 }, T4 - 0.1);
      cards.forEach((c, i) => {
        tl.to(c, { x: -170 + i * 40, y: -20 + i * 30, scale: 0.42, transformOrigin: 'left top', duration: 0.6, ease: 'power2.inOut' }, T4 + i * 0.08);
      });
      tl.fromTo('#inc-key', { opacity: 0, rotate: -15 }, { opacity: 1, rotate: 0, duration: 0.6, ease: 'expo.out' }, T4 + 0.4);
      tl.to(cards, { x: 940, y: 280, scale: 0.08, opacity: 0, duration: 0.5, ease: 'power3.in', stagger: 0.05 }, T4 + 0.55);
      wordsIn(document.querySelector('#inc-thread'), T4 + 0.6);
      tl.to('#inc-thread', { opacity: 0, filter: 'blur(6px)', duration: 0.2 }, END - 0.4);

      window.__timelines['incidents'] = tl;
    })();
  </script>
